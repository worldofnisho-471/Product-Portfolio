<title>ResearchOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a shared lab workbench. Project header with who is here, a section stepper, one working panel per section. */
:root {
  --paper: #f4f5f8;
  --surface: #ffffff;
  --ink: #171a2c;
  --muted: #5b6177;
  --line: #dde0e9;
  --accent: #2c46d4;
  --accent-soft: #e8ebfc;
  --good: #1d7f54;
  --good-soft: #e3f3eb;
  --warn: #9a6512;
  --warn-soft: #fbf0dc;
  --bad: #b8382f;
  --bad-soft: #fbe7e5;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11131b; --surface: #191c27; --ink: #e7e9f3; --muted: #9ca2b8; --line: #2a2e3d;
    --accent: #8d9cff; --accent-soft: #232a52; --good: #5cc796; --good-soft: #17312a;
    --warn: #e2b05e; --warn-soft: #34291a; --bad: #f08a80; --bad-soft: #3a1f1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11131b; --surface: #191c27; --ink: #e7e9f3; --muted: #9ca2b8; --line: #2a2e3d;
  --accent: #8d9cff; --accent-soft: #232a52; --good: #5cc796; --good-soft: #17312a;
  --warn: #e2b05e; --warn-soft: #34291a; --bad: #f08a80; --bad-soft: #3a1f1f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; }
.label { font: 500 .72rem/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
a { color: var(--accent); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--surface); font: 700 15px var(--f-display); }
.proj { display: grid; gap: 2px; min-width: 0; }
.example-tag { display: inline-block; font: 500 .7rem var(--f-mono); background: var(--warn-soft); color: var(--warn); padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }

.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.step { flex: 1 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer; font: 500 .92rem var(--f-body); color: var(--muted); text-align: left; }
.step .n { font: 500 .78rem var(--f-mono); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); flex: none; }
.step.done .n { background: var(--good-soft); color: var(--good); border-color: transparent; }
.step[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step[aria-selected="true"] .n { background: var(--accent); color: var(--surface); border-color: transparent; }
.step:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 20px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel-head > div { display: grid; gap: 4px; max-width: 62ch; }

.btn { font: 600 .9rem var(--f-body); padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.small { padding: 6px 11px; font-size: .82rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field.row { display: flex; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
textarea { min-height: 96px; resize: vertical; }

.status { font: 500 .85rem var(--f-mono); color: var(--muted); }
.status.err { color: var(--bad); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }

/* Idea check result */
.verdict-grid { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; }
.ring { width: 160px; height: 160px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num { font: 700 2.4rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.subs { display: grid; gap: 14px; min-width: 0; }
.sub { display: grid; gap: 4px; }
.sub-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .92rem; }
.sub-top span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 .8rem var(--f-body); padding: 4px 10px; border-radius: 99px; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.cols > section { display: grid; gap: 10px; align-content: start; min-width: 0; }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.lit a { display: block; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--paper); }
.lit a span { color: var(--accent); font-size: .82rem; display: block; }
.lit { display: grid; gap: 8px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col { border: 2px dashed transparent; transition: border-color .12s, background-color .12s; }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col-blocked .col-head .label { color: var(--bad); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .45; }
.card.blocked { border-color: var(--bad); }
.blocker { font-size: .82rem; color: var(--bad); background: var(--bad-soft); border-radius: 6px; padding: 5px 8px; }
.drop-hint { font-size: .85rem; border: 1px dashed var(--line); border-radius: 8px; padding: 14px 10px; text-align: center; }
.col { background: var(--paper); border-radius: 12px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-head { display: flex; justify-content: space-between; align-items: center; }
.count { font: 500 .78rem var(--f-mono); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.card:hover { border-color: var(--accent); }
.card .ms { font: 500 .7rem var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.card .t { font-weight: 600; font-size: .93rem; line-height: 1.35; }
.crit { font-size: .82rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
.card .meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; font: .75rem var(--f-mono); color: var(--muted); }
.card .move { width: auto; padding: 4px 8px; font: 500 .78rem var(--f-body); background: var(--surface); cursor: pointer; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.new { border-style: dashed; border-color: var(--accent); }

/* Results */
.log { display: grid; gap: 12px; }
.entry { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; }
.entry-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }

/* Next steps */
.recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.rec { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.rec .newtasks { display: grid; gap: 6px; }
.rec .nt { font-size: .85rem; background: var(--paper); border-radius: 8px; padding: 8px 10px; }
.diag { background: var(--accent-soft); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }

/* Task editor sheet */
.overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 45%, transparent);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 580px; max-height: 100%; overflow: auto; padding: 20px; display: grid; gap: 16px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.linked { display: grid; gap: 6px; }
.linked button { text-align: left; }

/* Review changes */
.chg { font-size: .85rem; display: grid; gap: 2px; }
.chg del { color: var(--bad); }
.chg ins { color: var(--good); text-decoration: none; font-weight: 500; }
.tag { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }

/* Notes */
.notes-tab { margin-left: 10px; }
.notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 18px; align-items: start; }
.note-list { display: grid; gap: 8px; }
.note-item { display: grid; gap: 4px; text-align: left; font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; width: 100%; }
.note-item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface); }
.note-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.note-item p { font-size: .84rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { width: auto; max-width: 100%; padding: 8px 10px; font-size: .86rem; }
.fsearch { flex: 1 1 220px; min-width: 0; padding: 8px 12px; font-size: .9rem; }
.fcount { font-size: .82rem; color: var(--muted); flex-basis: 100%; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .8rem var(--f-body); padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.kind { font: 500 .68rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.note-list { max-width: 820px; }
.note-card { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); min-width: 0; }
.note-card.open { background: var(--surface); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.note-head { display: grid; gap: 4px; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 13px 14px; cursor: pointer; border-radius: 12px; }
.note-head .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.note-head .right { display: flex; align-items: center; gap: 10px; flex: none; }
.chev { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); background: var(--surface); }
.chev svg { transition: transform .18s ease; }
.note-head:hover .chev { color: var(--accent); border-color: var(--accent); }
.note-head[aria-expanded="true"] .chev { color: var(--accent); }
.note-head[aria-expanded="true"] .chev svg { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .chev svg { transition: none; } }
.note-head .preview { font-size: .86rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.note-open { display: grid; gap: 12px; padding: 0 14px 14px; min-width: 0; }
.note-card > .note-open:first-child { padding-top: 14px; }
.note-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
.saved { background: var(--good-soft); color: var(--good); border-radius: 8px; padding: 8px 12px; font-size: .88rem; font-weight: 500; }
.note-editor textarea { min-height: 260px; font-family: var(--f-body); line-height: 1.6; }
@media (max-width: 720px) { .notes { grid-template-columns: 1fr; } }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 10px; justify-items: start; }

@media (max-width: 720px) {
  .board { grid-template-columns: 1fr; }
  .verdict-grid { grid-template-columns: 1fr; justify-items: start; }
  .panel { padding: 16px; }
  .step { flex: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .6s ease; }
}

/* Collaboration */
.people { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.avs { display: flex; }
.av { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--paper); object-fit: cover; background: var(--line); margin-left: -8px; flex: none; display: inline-block; }
.avs .av:first-child { margin-left: 0; }
.av.sm { width: 20px; height: 20px; border-width: 1px; margin-left: 0; }
.av.md { width: 34px; height: 34px; margin-left: 0; border-color: var(--surface); }
.here { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; flex: none; }
.role { font: 500 .7rem var(--f-mono); padding: 4px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; z-index: 40; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
.who-due { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
.assignee { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.due { font-family: var(--f-mono); font-size: .74rem; }
.due.late { color: var(--bad); font-weight: 600; }
.comments { display: grid; gap: 12px; }
.comment { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; }
.comment .av { width: 24px; height: 24px; margin: 0; border-width: 1px; }
.comment .line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: .85rem; }
.comment .line1 strong { font-weight: 600; }
.comment .when { font: .72rem var(--f-mono); color: var(--muted); }
.comment p { font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; font-size: .75rem; color: var(--muted); text-decoration: underline; cursor: pointer; }
.composer { display: grid; gap: 8px; }
.composer textarea { min-height: 64px; }
.team-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.team-grid > section { display: grid; gap: 12px; min-width: 0; }
.member { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.member .sub2 { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.feed li .when { font: .72rem var(--f-mono); color: var(--muted); display: block; }
.roles { width: 100%; border-collapse: collapse; font-size: .86rem; }
.roles th, .roles td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.roles th { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.table-wrap { overflow-x: auto; }
.danger-zone { border: 1px solid var(--bad); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.ro { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }
@media (max-width: 720px) { .team-grid { grid-template-columns: 1fr; } }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .big { font: 700 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi .big small { font: 500 .9rem var(--f-body); color: var(--muted); margin-left: 4px; }
.kpi .note { font-size: .82rem; color: var(--muted); }
.kpi.warn { border-color: var(--warn); }
.kpi.bad { border-color: var(--bad); }
.kpi.good { border-color: var(--good); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.dash-grid > section { display: grid; gap: 12px; min-width: 0; }
.ms-row { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ms-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ms-top strong { font-size: .95rem; }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); }
.stack i { display: block; height: 100%; }
.stack i + i { border-left: 2px solid var(--surface); }
.s-done { background: var(--good); }
.s-running { background: var(--accent); }
.s-blocked { background: var(--bad); }
.s-todo { background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ms-sub { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.score { width: 100%; border-collapse: collapse; font-size: .86rem; }
.score th, .score td { text-align: left; padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.score th { font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.score td.crit-cell { color: var(--muted); }

<div class="wrap">
  <header class="top">

    </div>

  </header>

  <p id="aiNotice" class="notice" hidden>Live AI runs when this page is opened in Claude. Everything else works without it.</p>

  <nav class="steps" role="tablist" aria-label="Project sections">
    <button class="step" role="tab" data-step="idea" type="button"><span class="n">1</span>Idea check</button>

  </nav>

  <main id="view" class="panel" role="tabpanel"></main>
</div>

<script>
/* ---------- Constants and state ---------- */
const STATUSES = ["To do", "Running", "Blocked", "Done"];
const KINDS = ["Protocol", "Observation", "Decision", "Literature"];
const STEP_NAMES = { dash: "Dashboard", idea: "Idea check", plan: "Research plan", results: "Log results", next: "Next steps", notes: "Notes", team: "Team" };
const BLANK_IDEA = { title: "", text: "", field: "", goal: "Academic paper" };

let db = null, user = null, room = null, sample = null;
let mode = "loading";               // loading | live | nodb
let me = { id: null, owner: false, role: "Viewer" };
let canWrite = true, canWriteKnown = false, canAdmin = false, canComment = true;
let pWrite = true, pAdmin = false, platRole = "Viewer";
const ROLES = ["Lead", "Researcher", "Observer"];
const ROLE_INFO = {
  Lead: "Everything: run the idea check, generate the plan, run AI reviews and approve their changes, start a new project.",
  Researcher: "Add, edit, move and assign tasks; log results; write notes; comment. AI changes wait for a Lead to approve them.",
  Observer: "Read everything and comment on tasks. Can't change the plan, results or notes."
};
function roleOf(id) {
  if (id === me.id) return myRole();
  const m = state.members.find(x => x.id === id);
  if (m && m.owner) return "Lead";
  if (!m) return "Observer";
  const r = state.roles.find(x => x.id === id);
  return r && ROLES.includes(r.role) ? r.role : "Researcher";
}
function myRole() {
  if (me.owner) return "Lead";
  if (!pWrite) return "Observer";
  const r = state.roles.find(x => x.id === me.id);
  return r && ROLES.includes(r.role) ? r.role : "Researcher";
}
function recompute() {
  me.role = myRole();
  canWrite = pWrite && me.role !== "Observer";
  canComment = pWrite;
  canAdmin = me.role === "Lead" && (pAdmin || me.owner);
}
let metaReady = false;
const state = { idea: { ...BLANK_IDEA }, assessment: null, milestones: [], review: null, addedRecs: [], tasks: [], results: [], notes: [], comments: [], activity: [], members: [], roles: [], evidence: [], econ: null, corpus: [], directions: null };
const all = { projects: [], tasks: [], results: [], notes: [], comments: [], evidence: [], econ: [], directions: [] };
let curPid = null;
const knownPids = new Set();
const pidOf = x => x.projectId || "meta";
const curProj = () => all.projects.find(p => p.id === curPid) || null;
function derive() {
  const p = curProj();
  if (curPid && !p && metaReady && knownPids.has(curPid)) curPid = null;
  state.idea = { ...BLANK_IDEA, ...((p && p.idea) || {}) };
  state.assessment = (p && p.assessment) || null;
  state.milestones = [...((p && p.milestones) || [])];
  state.review = (p && p.review) || null;
  state.addedRecs = [...((p && p.addedRecs) || [])];
  for (const k of ["tasks", "results", "notes", "comments", "evidence"]) state[k] = all[k].filter(x => pidOf(x) === curPid);
  state.econ = all.econ.find(x => x.id === curPid) || null;
  state.directions = all.directions.find(x => x.id === curPid) || null;
}
function rememberProject(pid) { try { if (pid) localStorage.setItem("researchos-current-project", pid); } catch {} }
function recalledProject() { try { return localStorage.getItem("researchos-current-project"); } catch { return null; } }
function openProject(pid) {
  curPid = pid; rememberProject(pid); derive();
  selectedTask = null; selectedNote = null; noteEditing = false; taskQ = ""; ownerF = "any"; msF = "all"; updF = "any"; noteQ = ""; noteTaskF = "all"; noteFilter = "All";
  setStep(state.tasks.length ? "dash" : "idea");
}
function goHome() { curPid = null; derive(); setStep("home"); }
let peers = [];
const people = {};
let step = null, tasksLoaded = false, selectedTask = null, selectedNote = null, noteFilter = "All", newNoteTask = null, noteEditing = false, noteFlash = "", dragId = null;
let taskQ = "", ownerF = "any", msF = "all", updF = "any", noteQ = "", noteTaskF = "all";
let aiBusy = null, aiError = null, editorHook = null;
const dirty = new Set();

/* ---------- Small helpers ---------- */
const view = document.getElementById("view");
const today = () => new Date().toISOString().slice(0, 10);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const taskTitle = id => (state.tasks.find(t => t.id === id) || {}).title;
const clamp = v => Math.max(0, Math.min(100, Math.round(Number(v) || 0)));
const clean = o => JSON.parse(JSON.stringify(o));
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDate = d => d ? `${Number(d.slice(8, 10))} ${MONTHS[Number(d.slice(5, 7)) - 1]}` : "";
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function ago(ts) {
  if (!ts) return "";
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return fmtDate(new Date(ts).toISOString().slice(0, 10));
}
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const pillClass = s => ({ Pursue: "good", "On track": "good", Yes: "good", Met: "good", Refine: "warn", Adjust: "warn", Partly: "warn", "At risk": "warn", Rethink: "bad", Pivot: "bad", No: "bad", Blocked: "bad", "Off track": "bad", "Not tested": "none", "Not started": "none" }[s] || "warn");
const errCopy = code => ({
  not_granted: "AI is turned off for this page. Allow Claude to use it from the page's permissions to run live.",
  sampling_disabled: "Claude isn't available for this account.",
  rate_limited: "Too many requests. Wait a minute, then try again.",
  invalid_json: "The AI answer came back in the wrong shape. Try again.",
  refused: "Claude declined this request. Try rewording the idea.",
  session_expired: "Your session expired. Sign in again, then retry."
}[code] || "Something went wrong reaching Claude. Try again.");
const lock = (root, allowed) => { if (!allowed) root.querySelectorAll("input, textarea, select, button").forEach(x => { x.disabled = true; }); return root; };

/* People */
function fullName(id) { if (!id) return "Someone"; const p = people[id]; return (p && p.name) || (id === me.id ? "You" : "Someone"); }
function nameOf(id) { return id && id === me.id ? "You" : fullName(id); }
function avatar(id, cls = "av") {
  const p = id && people[id];
  if (!p) return el("span", { class: cls, "aria-hidden": "true" });
  const i = el("img", { class: cls, alt: "", src: p.avatarUrl });
  if (p.color) i.style.background = p.color;
  return i;
}
function want(ids) {
  if (!user) return;
  const missing = [...new Set(ids.filter(x => x && !people[x]))];
  if (!missing.length) return;
  missing.forEach(x => { people[x] = people[x] || null; });
  user.profiles(missing).then(ps => { for (const [k, v] of Object.entries(ps)) people[k] = v; schedule(); }).catch(() => {});
}
function onlineIds() { return [...new Set(peers.filter(p => p.kind === "viewer" && p.by).map(p => p.by))]; }
function peerStep(id) { const p = peers.find(x => x.by === id && x.presence && x.presence.step); return p ? p.presence.step : null; }

/* Toast */
let toastTimer;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = el("div", { id: "toast", class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}

/* ---------- Writes to the shared project ---------- */
async function save(p) {
  try { await p; return true; }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" && !canWriteKnown) { pWrite = false; recompute(); schedule(); }
    toast(c === "invalid_argument" ? "You don't have permission to change this. Ask the project owner for more access."
      : c === "quota_exceeded" ? "The project has run out of space. Delete old notes or comments, then try again."
      : c === "revoked" ? "Your access to this project changed. Reload the page."
      : "Couldn't save that change. Check your connection and try again.");
    return false;
  }
}
const stamp = () => ({ updatedBy: me.id, updatedAt: Date.now() });
const metaBody = over => { const p = curProj() || {}; return clean({ idea: state.idea, assessment: state.assessment, milestones: state.milestones, review: state.review, addedRecs: state.addedRecs, createdAt: p.createdAt || null, createdBy: p.createdBy || null, ...over, ...stamp() }); };
const putMeta = over => save(db.doc("project/" + curPid).set(metaBody(over)));
function putTask(t) { const { id, ...rest } = t; return save(db.doc("tasks/" + id).set(clean({ projectId: curPid, ...rest, ...stamp() }))); }
const patchTask = (id, f) => save(db.doc("tasks/" + id).update(clean({ ...f, ...stamp() })));
const logAct = (text, target, pid) => { if (db) db.collection("activity").add(clean({ who: me.id, text, target: target || null, projectId: pid || curPid, ts: Date.now() })).catch(() => {}); };
async function wipe(colls) {
  for (const c of colls) await Promise.all(all[c].filter(x => pidOf(x) === curPid).map(x => db.doc(c + "/" + x.id).delete().catch(() => {})));
}
function allMilestones() {
  const out = [...state.milestones];
  state.tasks.forEach(t => { if (t.milestone && !out.includes(t.milestone)) out.push(t.milestone); });
  return out;
}

/* ---------- Live subscriptions ---------- */
let pending = false, memberDone = false;
function schedule() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(true); if (editorHook) editorHook(); });
}
function dbErr(e) { if (e && e.code === "revoked") toast("Your access to this project changed. Reload the page."); }
function subscribe() {
  const sub = (key, query, sort) => query.onSnapshot(s => {
    const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (sort) rows.sort(sort);
    if (key in all) { all[key] = rows; if (key === "projects") { metaReady = true; rows.forEach(x => knownPids.add(x.id)); } derive(); } else state[key] = rows;
    if (key === "tasks") tasksLoaded = true;
    if (key === "members") ensureMember();
    if (key === "roles" || key === "members") recompute();
    schedule();
  }, dbErr);
  sub("projects", db.collection("project"), (a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  sub("evidence", db.collection("evidence"));
  sub("econ", db.collection("econ"));
  sub("directions", db.collection("directions"));
  sub("corpus", db.collection("corpus"));
  sub("tasks", db.collection("tasks"), (a, b) => (a.order || 0) - (b.order || 0));
  sub("results", db.collection("results"), (a, b) => (a.ts || 0) - (b.ts || 0));
  sub("notes", db.collection("notes"));
  sub("comments", db.collection("comments"), (a, b) => (a.ts || 0) - (b.ts || 0));
  sub("activity", db.collection("activity").orderBy("ts", "desc").limit(40));
  sub("members", db.collection("members"));
  sub("roles", db.collection("roles"));
}
function ensureMember() {
  if (memberDone || !pWrite || !me.id) return;
  memberDone = true;
  const ex = state.members.find(m => m.id === me.id);
  if (ex && ex.platform === platRole && !!ex.owner === !!me.owner && Date.now() - (ex.lastSeen || 0) < 6 * 3600e3) return;
  db.doc("members/" + me.id).set({ platform: platRole, owner: !!me.owner, lastSeen: Date.now(), joined: (ex && ex.joined) || Date.now() })
    .catch(e => { if (e && e.code === "invalid_argument" && !canWriteKnown) { pWrite = false; recompute(); schedule(); } });
}

/* ---------- Render ---------- */
function setStep(s) { step = s; if (room) room.presence({ step: s, project: curPid }).catch(() => {}); render(); }
document.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => setStep(b.dataset.step)));
view.addEventListener("input", e => { if (e.target.id) dirty.add(e.target.id); });
view.addEventListener("change", e => { if (e.target.id && !e.target.classList.contains("move")) dirty.add(e.target.id); });

function header() {
  const t = document.getElementById("projTitle");
  const home = step === "home" || !curPid;
  t.textContent = home ? (metaReady ? "Research projects" : "ResearchOS") : (state.idea.title || "Untitled project");
  const crumb = document.getElementById("crumb");
  crumb.replaceChildren(home || !metaReady ? "ResearchOS" : el("button", { class: "crumb", type: "button", onclick: goHome }, "← All projects"));
  document.querySelector(".steps").hidden = home || mode !== "live";
  const done = { idea: !!state.assessment, plan: state.tasks.length > 0, results: state.results.length > 0, next: !!state.review, notes: state.notes.length > 0, team: state.members.length > 1 };
  document.querySelectorAll(".step").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.step === step ? "true" : "false");
    b.classList.toggle("done", !!done[b.dataset.step]);
  });
  const ro = document.getElementById("roNotice");
  ro.hidden = !(mode === "live" && !canWrite);
  ro.textContent = !pWrite ? "You have view-only access, so you can read everything but not change or comment. Ask the project owner to share the page with you as an Editor."
    : "You're an Observer on this project. You can read everything and comment on tasks. The project owner can change your role on the Team tab.";
  const box = document.getElementById("people");
  const ids = onlineIds();
  box.replaceChildren(
    ids.length ? el("div", { class: "avs" }, ids.slice(0, 5).map(id => avatar(id))) : null,
    ids.length ? el("span", { class: "here" }, el("span", { class: "dot" }), `${ids.length} here now`) : null,
    mode === "live" ? el("span", { class: "role", text: "You: " + me.role }) : null);
